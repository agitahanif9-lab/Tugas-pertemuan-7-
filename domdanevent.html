<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>2.6 DOM dan Event</title>
</head>
<body>
    <h3>2.6 DOM dan Event</h3>
    <input type="text" id="nama" placeholder="Nama Anda">
    <button onclick="sapa()">Sapa</button>
    <p id="hasil"></p>

    <script>
        function sapa() {
            let nama = document.getElementById("nama").value;
            document.getElementById("hasil").textContent = "Halo, " + nama + "!";
        }
    </script>
</body>
</html>
