<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Latihan 2 - Percabangan dan Perulangan</title>
</head>
<body>
    <h3>Latihan 2: Angka 1 - 10 Ganjil / Genap (Cek Console)</h3>

    <script>
        for (let n = 1; n <= 10; n++) {
            if (n % 2 === 0) {
                console.log(n + " adalah genap");
            } else {
                console.log(n + " adalah ganjil");
            }
        }
    </script>
</body>
</html>
