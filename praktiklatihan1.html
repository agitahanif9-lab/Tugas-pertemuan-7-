<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Latihan 1 - Variabel dan Operator</title>
</head>
<body>
    <h3>Latihan 1: Luas & Keliling Persegi Panjang (Cek Console)</h3>

    <script>
        // Nilai awal
        let panjang = 8;
        let lebar = 5;

        let luas = panjang * lebar;
        let keliling = 2 * (panjang + lebar);

        console.log("--- Nilai Awal ---");
        console.log("Panjang: " + panjang + ", Lebar: " + lebar);
        console.log("Luas: " + luas);         // 40
        console.log("Keliling: " + keliling); // 26

        // Mengubah nilai variabel
        panjang = 12;
        lebar = 6;

        luas = panjang * lebar;
        keliling = 2 * (panjang + lebar);

        console.log("--- Setelah Nilai Diubah ---");
        console.log("Panjang: " + panjang + ", Lebar: " + lebar);
        console.log("Luas: " + luas);         // 72
        console.log("Keliling: " + keliling); // 36
    </script>
</body>
</html>
